version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmp_user
      POSTGRES_PASSWORD: mmp_pass
      POSTGRES_DB: mmp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mmp-redis
    restart: unless-stopped

  backend:
    build:
      context: ./multi-messaging-platform
      dockerfile: Dockerfile
    container_name: mmp-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ./multi-messaging-platform/.env.production
    volumes:
      - ./multi-messaging-platform/storage:/app/storage
      - ./logs:/app/logs
    command: uvicorn core_engine.main:app --host 0.0.0.0 --port 8900

  celery:
    build:
      context: ./multi-messaging-platform
      dockerfile: Dockerfile
    container_name: mmp-celery
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ./multi-messaging-platform/.env.production
    command: python3 -m celery -A workers.tasks.celery_app worker --loglevel=info
    volumes:
      - ./multi-messaging-platform/storage:/app/storage

  migrate:
    build:
      context: ./multi-messaging-platform
      dockerfile: Dockerfile
    container_name: mmp-migrate
    depends_on:
      - postgres
    env_file:
      - ./multi-messaging-platform/.env.production
    command: sh -c "alembic merge heads -m merge 2>/dev/null; alembic upgrade heads"
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mmp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8900:3010"

volumes:
  postgres_data:

# این خط رو به frontend service اضافه کن
