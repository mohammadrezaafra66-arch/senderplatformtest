version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: mmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmp_user
      POSTGRES_PASSWORD: mmp_pass
      POSTGRES_DB: mmp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: mmp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./multi-messaging-platform
      dockerfile: Dockerfile
    container_name: mmp-backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ./multi-messaging-platform/.env.production
    ports:
      - "8001:8001"
    volumes:
      - ./multi-messaging-platform/storage:/app/storage
      - ./logs:/app/logs

  celery:
    build:
      context: ./multi-messaging-platform
      dockerfile: Dockerfile
    container_name: mmp-celery
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    env_file:
      - ./multi-messaging-platform/.env.production
    command: python3 -m celery -A workers.celery_app worker --loglevel=info
    volumes:
      - ./multi-messaging-platform/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mmp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    ports:
      - "3010:3010"

volumes:
  postgres_data:
